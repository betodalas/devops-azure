apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-azure-api
  labels:
    app: devops-azure-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-azure-api
  template:
    metadata:
      labels:
        app: devops-azure-api
      annotations:
        # Lets Prometheus (via a PodMonitor/annotations-based scrape config)
        # discover the /metrics endpoint without extra wiring.
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: ghcr.io/betodalas/devops-azure-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: devops-azure-api-config
            - secretRef:
                name: devops-azure-api-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # Liveness: restart the pod only if the process is truly stuck.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: separate signal so Kubernetes can pull the pod out of
          # the Service during warm-up without killing it.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
